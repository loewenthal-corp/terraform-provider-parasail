---
name: ci

"on":
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CI: "true"
  GOPRIVATE: github.com/loewenthal-corp/

jobs:
  do:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task:
          - format
          - lint
          - examples:validate
          - docs
          - test
          - security
          - build
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.LOEWENTHAL_CORPORATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LOEWENTHAL_CORPORATION_BOT_PRIVATE_SIGNING_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        with:
          cache: "true"

      - name: Configure git to use generated token for github.com
        env:
          GH_APP_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git config --global \
            "url.https://x-access-token:${GH_APP_TOKEN}@github.com/.insteadOf" \
            "https://github.com/"

      - name: Run task
        run: task ${{ matrix.task }}

      - name: Verify generated files are committed
        run: git diff --exit-code

  check:
    if: always()
    needs:
      - do
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
